# Roadmap de lançamentos por semestre e conjuntos em teste.
# Cada item de `releases` é um semestre de lançamento (year + semester).
# `version` fica null até a versão do semestre ser definida.
# Status: planejada | conceito | desenvolvimento | teste | lancado
# Em `lancado`, expected_release é a data real de lançamento.
# Ao mudar expected_release, atualize também date_updated_at (YYYY-MM-DD).
# Ao concluir um teste: mova de active_tests para finished_tests e preencha finished_at.
# Nomes de testes sempre em minúsculo.

releases:
  - year: 2026
    semester: 1
    version: "v2.28.0-1"
    status: lancado
    expected_release: 2026-08-19
    date_updated_at: 2026-08-19
    summary: "Suporte ao modelo RB-08, melhorias na experiência do usuário no início da máquina e estabilidade de sensores."
    planned_features:
      - "Suporte ao modelo de máquina RB-08"
      - "Melhorias na experiência do usuário no início da máquina"
      - "Código para fluxo de matrícula acessar tela de QRCode"
      - "Ajuste na leitura de sensores ao detectar possível curto"

